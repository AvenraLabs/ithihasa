    <!-- Open Graph / Facebook / WhatsApp Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ithihasa.co.in" />
    <meta property="og:title" content="ITHIHASA — Wear Your Legacy" />
    <meta property="og:description" content="Premium royal heritage clothing, silk kurtas, bandhgalas, and pure pashminas handcrafted in India." />

    <!-- Twitter Card Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ITHIHASA — Wear Your Legacy" />
    <meta name="twitter:description" content="Premium royal heritage clothing, silk kurtas, bandhgalas, and pure pashminas handcrafted in India." />
    <meta name="twitter:image" content="/ithihasa.png" />

    <title>ITHIHASA — Wear Your Legacy</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ithihasa_theme');
          var theme = (saved === 'dark' || saved === 'light')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-[var(--gold)] selection:text-[#0A0A0A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
