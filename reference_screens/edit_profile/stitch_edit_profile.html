<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - Ithihasa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md selection:bg-surface-dim">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 transition-all duration-300 ease-in-out">
<button class="text-primary hover:opacity-70 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-widest text-tertiary-fixed-dim">EDIT PROFILE</h1>
<div class="w-6 h-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="pt-[80px] pb-xxl px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto min-h-screen flex flex-col items-center">
<div class="w-full max-w-md mt-xl">
<!-- Profile Picture Section -->
<div class="flex flex-col items-center mb-xxl w-full">
<h2 class="font-label-caps text-label-caps tracking-widest text-secondary mb-lg">CHOOSE YOUR AVATAR</h2>
<div class="flex flex-wrap justify-center gap-md w-full">
<!-- Avatar 1 (Selected) -->
<div class="relative group cursor-pointer">
<div class="w-20 h-20 rounded-full overflow-hidden border-2 border-tertiary-fixed-dim p-1 transition-all duration-300">
<img alt="Avatar 1" class="w-full h-full object-cover rounded-full" src="/avatar/screen.png"/>
</div>
<div class="absolute -top-1 -right-1 bg-tertiary-fixed-dim text-on-tertiary-fixed-variant rounded-full w-6 h-6 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</div>
<!-- Avatar 2 -->
<div class="relative group cursor-pointer">
<div class="w-20 h-20 rounded-full overflow-hidden border border-outline-variant hover:border-tertiary-fixed-dim p-1 transition-all duration-300">
<img alt="Avatar 2" class="w-full h-full object-cover rounded-full opacity-80 group-hover:opacity-100" src="/avatar1/screen.png"/>
</div>
</div>
<!-- Avatar 3 -->
<div class="relative group cursor-pointer">
<div class="w-20 h-20 rounded-full overflow-hidden border border-outline-variant hover:border-tertiary-fixed-dim p-1 transition-all duration-300">
<img alt="Avatar 3" class="w-full h-full object-cover rounded-full opacity-80 group-hover:opacity-100" src="/avatar2/screen.png"/>
</div>
</div>
</div>
</div>
<!-- Form -->
<form class="w-full space-y-md">
<div class="floating-label-group">
<input class="input-underline font-body-md text-on-surface" id="fullName" placeholder=" " type="text" value="Eleanor Vance"/>
<label class="font-label-caps text-label-caps tracking-widest" for="fullName">FULL NAME</label>
</div>
<div class="floating-label-group">
<input class="input-underline font-body-md text-on-surface" id="email" placeholder=" " type="email" value="eleanor.v@example.com"/>
<label class="font-label-caps text-label-caps tracking-widest" for="email">EMAIL ADDRESS</label>
</div>
<div class="floating-label-group">
<input class="input-underline font-body-md text-on-surface" id="phone" placeholder=" " type="tel" value="+1 (555) 123-4567"/>
<label class="font-label-caps text-label-caps tracking-widest" for="phone">PHONE NUMBER</label>
</div>
<div class="pt-xl">
<button class="w-full bg-primary text-on-primary py-4 font-label-caps text-label-caps tracking-widest hover:bg-tertiary-fixed-dim hover:text-on-tertiary-fixed-variant transition-colors duration-300" type="button">SAVE CHANGES</button>
</div>
<div class="text-center pt-md">
<button class="font-label-caps text-label-caps text-secondary underline hover:text-primary transition-colors" type="button">DISCARD CHANGES</button>
</div>
</form>
</div>
</main>
</body>
</html>
