<p class="font-body-md text-body-md mt-sm text-on-surface-variant/70">Heritage in every thread.</p>
</div>
</div>
<!-- Right/Bottom Section: Login Form -->
<main class="w-full md:w-1/2 flex flex-col justify-center items-center p-margin-mobile md:p-margin-desktop min-h-screen bg-surface">
<div class="w-full max-w-[400px] flex flex-col gap-xl">

<div class="md:hidden text-center mb-md">
<h1 class="font-headline-md text-headline-md tracking-[0.2em] text-on-tertiary-container">ITHIHASA</h1>
</div>
<!-- Login Header -->
<div class="flex flex-col gap-xs text-center md:text-left">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface">Login</h2>
<p class="font-body-md text-body-md text-secondary">Welcome back to the atelier.</p>
</div>
<!-- Google Login Button -->
<button class="w-full h-12 flex items-center justify-center gap-sm bg-transparent border border-surface-dim hover:border-outline transition-colors duration-300 font-label-caps text-label-caps text-on-surface uppercase tracking-widest rounded-none">

<span class="font-label-caps text-label-caps text-secondary uppercase tracking-widest">Or</span>
<div class="h-[1px] flex-grow bg-surface-dim"></div>
</div>

<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Mobile Number Input -->
<div class="input-wrapper relative pt-sm">
<input class="input-underline w-full bg-transparent border-0 border-b border-surface-dim py-sm px-0 font-body-md text-body-md text-on-surface focus:ring-0 peer" id="mobile" name="mobile" placeholder=" " required="" type="tel"/>
<label class="input-label absolute left-0 top-1/2 -translate-y-1/2 font-label-caps text-label-caps text-secondary uppercase tracking-widest pointer-events-none peer-focus:text-on-surface" for="mobile">Enter Mobile Number</label>
</div>
<!-- Password Input -->
<div class="input-wrapper relative pt-sm">
<input class="input-underline w-full bg-transparent border-0 border-b border-surface-dim py-sm px-0 font-body-md text-body-md text-on-surface focus:ring-0 peer" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="input-label absolute left-0 top-1/2 -translate-y-1/2 font-label-caps text-label-caps text-secondary uppercase tracking-widest pointer-events-none peer-focus:text-on-surface" for="password">Password</label>
</div>
<div class="flex justify-between items-center mt-xs">
<a class="font-label-caps text-label-caps text-on-tertiary-container uppercase tracking-widest hover:underline decoration-1 underline-offset-4 transition-all" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary text-on-primary font-label-caps text-label-caps uppercase tracking-[0.2em] rounded-none hover:bg-on-surface-variant transition-colors duration-300 mt-md" type="submit">
                    Sign In
                </button>
</form>
<div class="text-center mt-md">
<p class="font-body-sm text-body-sm text-secondary">Don't have an account? <a class="font-label-caps text-label-caps text-primary uppercase tracking-widest hover:underline decoration-1 underline-offset-4 ml-xs" href="#">Register</a></p>
