name: Deploy Ithihasa Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Production VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER || 'nessi' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== [1/6] Pulling Latest Ithihasa Code ==="
            cd ~/ithihasa
            git fetch origin
            git reset --hard origin/main

            echo "=== [2/6] Backend: Installing Dependencies, Building TypeScript & Running DB Migrations ==="
            cd ~/ithihasa/backend
            npm ci --prefer-offline --no-audit
            npm run build
            npm run db:migrate || true

            echo "=== [3/6] Backend: Reloading PM2 Service ==="
            pm2 reload ithihasa-backend --update-env || pm2 start dist/app/server.js --name ithihasa-backend
            pm2 save

            echo "=== [4/6] Backend: Verifying Health Check ==="
            PORT_NUM=$(grep -E '^PORT=' ~/ithihasa/backend/.env | cut -d '=' -f2 | tr -d '\r\n' || echo "5003")
            HEALTH_URL="http://127.0.0.1:${PORT_NUM:-5003}/health"
            HEALTHY=0
            for i in $(seq 1 10); do
              echo "Checking backend health (attempt $i/10)..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Backend is healthy (HTTP 200)!"
                HEALTHY=1
                break
              fi
              echo "Health check returned HTTP $HTTP_CODE, retrying in 3s..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "::error::Backend health check failed! Dumping last 50 lines of PM2 logs:"
              pm2 logs ithihasa-backend --lines 50 --nostream
              exit 1
            fi

            echo "=== [5/6] Frontend: Building Storefront App ==="
            cd ~/ithihasa/frontend
            npm ci --prefer-offline --no-audit
            npm run build

            echo "=== [6/6] Admin Panel: Building Management Console ==="
            cd ~/ithihasa/adminpanel
            npm ci --prefer-offline --no-audit
            npm run build

            echo "=== Reloading Reverse Proxy (Caddy) ==="
            sudo systemctl reload caddy || true

            echo "=== 🚀 Ithihasa Production Deployment Finished Successfully! ==="
