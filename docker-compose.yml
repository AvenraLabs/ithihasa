version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ithihasa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ithihasa_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ithihasa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:admin123@postgres:5432/ithihasa_db
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
      JWT_SECRET: ithihasa_prod_secret_token_2026_secure
      REFRESH_TOKEN_SECRET: ithihasa_prod_refresh_secret_token_2026_secure
    ports:
      - '5000:5000'

  adminpanel:
    build:
      context: ./adminpanel
      dockerfile: Dockerfile
    container_name: ithihasa-adminpanel
    restart: unless-stopped
    ports:
      - '5174:80'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ithihasa-frontend
    restart: unless-stopped
    ports:
      - '5173:80'

volumes:
  postgres_data:
